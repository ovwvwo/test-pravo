<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Право интеллектуальной собственности — тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4EFE3; --paper-2: #ECE4D3; --ink: #26221B; --navy: #1F3245;
    --burgundy: #7A2331; --burgundy-dark: #591824; --gold: #A9822F;
    --green: #2E6B45; --green-bg: #E3EEE2; --red: #A5342A; --red-bg: #F3E1DC;
    --line: #C9BFA8; --card: #FFFDF7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1712; --paper-2:#221D16; --ink:#ECE6D6; --navy:#D9E2EA;
      --card:#24201A; --line:#46402F; --green-bg:#1E2E22; --red-bg:#33201D;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1B1712; --paper-2:#221D16; --ink:#ECE6D6; --navy:#D9E2EA;
    --card:#24201A; --line:#46402F; --green-bg:#1E2E22; --red-bg:#33201D;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(122,35,49,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(169,130,47,0.06), transparent 40%);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px; min-height: 100%;
  }
  .wrap { width: 100%; max-width: 620px; }
  .letterhead { text-align: center; margin-bottom: 22px; }
  .letterhead .eyebrow { font-family: 'PT Serif', Georgia, serif; font-style: italic; color: var(--gold); font-size: 0.95rem; }
  .letterhead h1 { font-family: 'PT Serif', Georgia, serif; font-weight: 700; font-size: clamp(1.4rem, 4vw, 2rem); margin: 4px 0 0; color: var(--navy); }
  .letterhead .rule { width: 96px; height: 3px; background: var(--burgundy); margin: 14px auto 0; border-radius: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 30px -18px rgba(38,34,27,0.35); padding: 30px 30px 26px; position: relative; overflow: hidden; }
  .card::before { content:""; position:absolute; top:0; left:0; right:0; height:5px; background: linear-gradient(90deg, var(--burgundy), var(--gold)); }

  /* Name gate */
  .gate p { font-size: 0.98rem; line-height: 1.5; color: var(--ink); margin: 0 0 18px; }
  .gate label { display:block; font-family:'PT Serif', Georgia, serif; color: var(--navy); margin-bottom: 8px; font-size: 1rem; }
  .gate input {
    width: 100%; font-family:'Inter', sans-serif; font-size: 1rem;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper-2); color: var(--ink); margin-bottom: 8px;
  }
  .gate input:focus { outline: 3px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
  .gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 10px; }

  .meta-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .qcount { font-family:'PT Serif', Georgia, serif; color: var(--navy); font-size:0.95rem; }
  .seal { width:52px; height:52px; border-radius:50%; border:2px solid var(--burgundy); display:flex; align-items:center; justify-content:center; font-family:'PT Serif', Georgia, serif; font-weight:700; color:var(--burgundy); font-size:0.85rem; flex-direction:column; line-height:1; transform: rotate(-6deg); }
  .seal span{display:block;} .seal .of{font-size:0.55rem; font-weight:400; margin-top:2px; opacity:0.8;}

  .track { height:6px; background: var(--paper-2); border-radius:4px; overflow:hidden; margin-bottom:24px; }
  .track-fill { height:100%; background: var(--burgundy); border-radius:4px; transition: width 0.4s ease; }

  .question { font-family:'PT Serif', Georgia, serif; font-size: clamp(1.05rem, 2.4vw, 1.28rem); line-height:1.5; color: var(--ink); margin:0 0 22px; }

  .options { display:flex; flex-direction:column; gap:10px; }
  .opt { display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%; background: var(--paper-2); border:1px solid var(--line); border-radius:5px; padding:13px 16px; font-family:'Inter', sans-serif; font-size:0.98rem; line-height:1.4; color:var(--ink); cursor:pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
  .opt:hover:not(:disabled){ border-color: var(--gold); transform: translateX(2px); }
  .opt:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .opt .letter { font-family:'PT Serif', Georgia, serif; font-weight:700; color:var(--burgundy); flex-shrink:0; width:1.2em; }
  .opt:disabled { cursor:default; }
  .opt.correct { background: var(--green-bg); border-color: var(--green); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { background: var(--red-bg); border-color: var(--red); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity:0.55; }
  .mark { margin-left:auto; font-weight:700; flex-shrink:0; }
  .opt.correct .mark { color: var(--green); }
  .opt.incorrect .mark { color: var(--red); }

  .explain { margin-top:18px; padding:14px 16px; border-left:3px solid var(--gold); background: var(--paper-2); border-radius:0 5px 5px 0; font-size:0.92rem; line-height:1.5; display:none; }
  .explain.show { display:block; }
  .explain b { color: var(--navy); }

  .actions { display:flex; justify-content:flex-end; margin-top:22px; gap:10px; }
  .btn { font-family:'Inter', sans-serif; font-weight:600; font-size:0.95rem; border:none; border-radius:5px; padding:11px 22px; cursor:pointer; background: var(--burgundy); color:#FBF6EA; transition: background 0.15s ease; }
  .btn:hover { background: var(--burgundy-dark); }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .btn.ghost { background: transparent; color: var(--navy); border:1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--gold); background: var(--paper-2); }

  .celebrate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(31,50,69,0.35); backdrop-filter: blur(1px); z-index:50; opacity:0; pointer-events:none; transition: opacity 0.2s ease; }
  .celebrate.show { opacity:1; pointer-events:auto; }
  .sticker { background: var(--card); border:2px solid var(--green); border-radius:10px; padding:28px 34px; text-align:center; max-width:320px; transform: scale(0.85) rotate(-3deg); transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 20px 50px -20px rgba(0,0,0,0.4); }
  .celebrate.show .sticker { transform: scale(1) rotate(-1.5deg); }
  .sticker .emoji { font-size:2.6rem; display:block; margin-bottom:8px; }
  .sticker .msg { font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:1.15rem; color: var(--green); line-height:1.3; }
  @media (prefers-reduced-motion: reduce) {
    .opt, .btn, .track-fill, .sticker, .celebrate { transition: none !important; }
  }

  .result { text-align:center; }
  .result .name-line { font-family:'PT Serif', Georgia, serif; font-style: italic; color: var(--navy); font-size: 1.05rem; margin-bottom: 4px; }
  .result .score { font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:3rem; color: var(--burgundy); margin:8px 0 4px; }
  .result .score span { font-size:1.4rem; color: var(--navy); }
  .result .verdict { font-family:'PT Serif', Georgia, serif; font-style: italic; color: var(--navy); margin-bottom: 18px; }
  .copy-hint { font-size: 0.82rem; color: var(--gold); margin-top: 10px; min-height: 1.2em; }

  footer.hint { text-align:center; margin-top:16px; font-size:0.78rem; color: var(--gold); opacity:0.85; }
</style>
</head>
<body>
<div class="wrap">
  <div class="letterhead">
    <div class="eyebrow">Право интеллектуальной собственности</div>
    <h1>Проверочный тест</h1>
    <div class="rule"></div>
  </div>
  <div class="card" id="card"></div>
  <footer class="hint" id="hint">Введите имя, чтобы начать</footer>
</div>

<div class="celebrate" id="celebrate">
  <div class="sticker">
    <span class="emoji" id="celEmoji">🎉</span>
    <span class="msg" id="celMsg">Верно!</span>
  </div>
</div>

<script>
const QUESTIONS = [
{q:"Что в российском гражданском праве понимается под интеллектуальной собственностью?",o:["Только произведения литературы и искусства","Результаты интеллектуальной деятельности и приравненные к ним средства индивидуализации, которым предоставляется правовая охрана","Любое имущество, созданное человеком","Только объекты, зарегистрированные государством"],c:1,e:"Интеллектуальная собственность охватывает охраняемые результаты интеллектуальной деятельности и средства индивидуализации."},
{q:"Как соотносятся понятия «интеллектуальная собственность» и «интеллектуальные права»?",o:["Это полностью идентичные понятия","Интеллектуальная собственность — это совокупность охраняемых объектов, а интеллектуальные права — права на них","Интеллектуальные права существуют только после государственной регистрации","Интеллектуальная собственность относится только к патентному праву"],c:1,e:"Интеллектуальная собственность — объекты, интеллектуальные права — права на эти объекты."},
{q:"Какое право является личным неимущественным правом автора произведения?",o:["Право следования","Право авторства","Право распоряжения исключительным правом","Право залога исключительного права"],c:1,e:"Право авторства является личным неимущественным правом автора."},
{q:"Может ли автор отказаться от права авторства и передать его другому лицу?",o:["Да, если заключен письменный договор","Да, если это предусмотрено лицензионным договором","Нет, право авторства неотчуждаемо и непередаваемо","Да, с согласия Роспатента"],c:2,e:"Право авторства неотчуждаемо и непередаваемо."},
{q:"Когда возникает авторское право на произведение?",o:["После государственной регистрации","После нотариального удостоверения","С момента создания произведения","После публикации произведения"],c:2,e:"Авторское право возникает с момента создания произведения."},
{q:"Может ли авторское право распространяться на произведение, которое никогда не было опубликовано?",o:["Нет","Да","Только при наличии регистрации","Только если произведение имеет коммерческую ценность"],c:1,e:"Необнародованность сама по себе не препятствует возникновению авторского права."},
{q:"Что представляет собой исключительное право?",o:["Право автора только на указание своего имени","Право использовать результат интеллектуальной деятельности или средство индивидуализации по своему усмотрению и разрешать или запрещать такое использование другим лицам","Только право продать объект","Только право зарегистрировать объект"],c:1,e:"Это содержание исключительного права по общему правилу."},
{q:"Может ли исключительное право быть передано другому лицу?",o:["Нет, оно всегда принадлежит первоначальному правообладателю","Да, в предусмотренных законом случаях, в том числе по договору об отчуждении исключительного права","Только по наследству","Только по решению суда"],c:1,e:"Исключительное право может переходить к другим лицам, в частности по договору отчуждения."},
{q:"Чем договор об отчуждении исключительного права принципиально отличается от лицензионного договора?",o:["При отчуждении правообладатель передает исключительное право целиком, а по лицензии предоставляет право использования","При лицензии право передается навсегда","При отчуждении передается только право авторства","Отличий между ними нет"],c:0,e:"При отчуждении право передается целиком, при лицензии предоставляется право использования."},
{q:"Какое из перечисленного относится к объектам патентных прав?",o:["Товарный знак","Фирменное наименование","Изобретение","Коммерческое обозначение"],c:2,e:"Изобретения относятся к объектам патентных прав."},
{q:"Какое изобретение соответствует общему требованию патентоспособности?",o:["Оно является новым, имеет изобретательский уровень и промышленно применимо","Оно обязательно должно быть опубликовано до подачи заявки","Оно должно быть зарегистрировано как товарный знак","Оно должно иметь автора — юридическое лицо"],c:0,e:"Критерии патентоспособности изобретения: новизна, изобретательский уровень, промышленная применимость."},
{q:"Что из перечисленного относится к средствам индивидуализации?",o:["Изобретение","Полезная модель","Товарный знак","Научная теория"],c:2,e:"Товарный знак — средство индивидуализации."},
{q:"Исключительное право на товарный знак возникает:",o:["С момента разработки обозначения","С момента первой продажи товара","В результате государственной регистрации товарного знака в установленном законом порядке","С момента размещения обозначения в интернете"],c:2,e:"Для товарного знака действует регистрационная система охраны."},
{q:"Что означает принцип исчерпания исключительного права на товарный знак?",o:["После первой продажи товарный знак прекращает существовать","В определенных законом случаях дальнейшее использование конкретного товара, правомерно введенного в оборот правообладателем или с его согласия, не требует отдельного разрешения правообладателя","Любой товар можно использовать без ограничений","Правообладатель теряет товарный знак после первой продажи"],c:1,e:"После правомерного введения конкретного товара в оборот право в предусмотренных законом пределах исчерпывается."},
{q:"Какие способы защиты интеллектуальных прав может использовать правообладатель при нарушении исключительного права?",o:["Только требование о возмещении морального вреда","Требование о признании права, пресечении нарушения, возмещении убытков и в предусмотренных законом случаях выплате компенсации и другие способы","Только расторжение трудового договора с нарушителем","Только обращение в полицию"],c:1,e:"Закон предусматривает комплекс способов защиты интеллектуальных прав."}
];

const CELEBRATIONS = [
  {emoji:"🎉", msg:"Верно! Роспатент бы гордился."},
  {emoji:"🏆", msg:"Точно в яблочко!"},
  {emoji:"🥳", msg:"Есть! Пять баллов на зачёте."},
  {emoji:"✨", msg:"Именно так, коллега-юрист!"},
  {emoji:"👏", msg:"Правильно — можно себя похвалить."},
  {emoji:"🔥", msg:"В точку! Продолжаем."},
  {emoji:"💡", msg:"Верно, юридическая логика на месте."},
  {emoji:"🎯", msg:"Прямое попадание!"},
  {emoji:"📜", msg:"Так и запишем — верно."},
  {emoji:"🚀", msg:"Отлично, летим дальше!"},
  {emoji:"🍀", msg:"Верно! Удача тут ни при чём — это знание."},
  {emoji:"⭐", msg:"Именно то, что нужно."}
];

let userName = "";
let current = 0;
let score = 0;
let answered = false;
const letters = ["А","Б","В","Г"];
const card = document.getElementById('card');
const hint = document.getElementById('hint');
const celebrate = document.getElementById('celebrate');
const celEmoji = document.getElementById('celEmoji');
const celMsg = document.getElementById('celMsg');

function renderGate() {
  card.innerHTML = `
    <div class="gate">
      <p>Перед началом теста укажите, пожалуйста, своё имя и фамилию — так преподаватель сможет учесть ваш результат.</p>
      <label for="nameInput">Имя и фамилия</label>
      <input id="nameInput" type="text" placeholder="Например: Иванова Мария" autocomplete="name" />
      <div class="err" id="nameErr"></div>
      <div class="actions">
        <button class="btn" id="startBtn">Начать тест</button>
      </div>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  const err = document.getElementById('nameErr');
  const tryStart = () => {
    const val = input.value.trim();
    if (val.length < 2) {
      err.textContent = "Пожалуйста, введите имя (минимум 2 символа).";
      return;
    }
    userName = val;
    hint.textContent = "Нажмите на вариант ответа, чтобы увидеть результат";
    renderQuestion();
  };
  startBtn.addEventListener('click', tryStart);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryStart(); });
  input.focus();
}

function renderQuestion() {
  answered = false;
  const item = QUESTIONS[current];
  const pct = Math.round((current) / QUESTIONS.length * 100);
  card.innerHTML = `
    <div class="meta-row">
      <div class="qcount">Вопрос ${current + 1} из ${QUESTIONS.length}</div>
      <div class="seal"><span>${current + 1}</span><span class="of">из ${QUESTIONS.length}</span></div>
    </div>
    <div class="track"><div class="track-fill" style="width:${pct}%"></div></div>
    <p class="question">${item.q}</p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="btn" id="nextBtn" disabled>${current === QUESTIONS.length - 1 ? 'Показать результат' : 'Следующий вопрос'}</button>
    </div>
  `;
  const optsEl = document.getElementById('options');
  item.o.forEach((text, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${letters[idx]})</span><span>${text}</span>`;
    b.addEventListener('click', () => selectOption(idx));
    optsEl.appendChild(b);
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const item = QUESTIONS[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.c) {
      btn.classList.add('correct');
      btn.innerHTML += '<span class="mark">✓</span>';
    } else if (i === idx) {
      btn.classList.add('incorrect');
      btn.innerHTML += '<span class="mark">✕</span>';
    } else {
      btn.classList.add('dim');
    }
  });
  const explain = document.getElementById('explain');
  explain.innerHTML = `<b>Пояснение.</b> ${item.e}`;
  explain.classList.add('show');
  document.getElementById('nextBtn').disabled = false;

  if (idx === item.c) {
    score++;
    showCelebration();
  }
}

function showCelebration() {
  const pick = CELEBRATIONS[Math.floor(Math.random() * CELEBRATIONS.length)];
  celEmoji.textContent = pick.emoji;
  celMsg.textContent = pick.msg;
  celebrate.classList.add('show');
  clearTimeout(showCelebration._t);
  showCelebration._t = setTimeout(() => celebrate.classList.remove('show'), 1100);
  celebrate.onclick = () => celebrate.classList.remove('show');
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    renderResult();
  }
}

function renderResult() {
  hint.textContent = "Покажите или отправьте результат преподавателю";
  const pct = Math.round(score / QUESTIONS.length * 100);
  let verdict;
  if (pct === 100) verdict = "Безупречно — хоть сейчас на экзамен.";
  else if (pct >= 80) verdict = "Отличный результат, материал усвоен.";
  else if (pct >= 60) verdict = "Неплохо, но стоит повторить пару тем.";
  else verdict = "Стоит перечитать конспект перед зачётом.";

  const resultText = `${userName} — ${score} из ${QUESTIONS.length}`;

  card.innerHTML = `
    <div class="result">
      <div class="qcount">Тест завершён</div>
      <div class="name-line">${userName}</div>
      <div class="score">${score}<span> / ${QUESTIONS.length}</span></div>
      <div class="verdict">${verdict}</div>
      <div class="actions" style="justify-content:center; gap:12px;">
        <button class="btn" id="copyBtn">Скопировать результат</button>
        <button class="btn ghost" id="restartBtn">Пройти заново</button>
      </div>
      <div class="copy-hint" id="copyHint"></div>
    </div>
  `;
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const copyHint = document.getElementById('copyHint');
    try {
      await navigator.clipboard.writeText(resultText);
      copyHint.textContent = "Скопировано — отправьте преподавателю.";
    } catch (e) {
      copyHint.textContent = resultText;
    }
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0; score = 0; userName = "";
    hint.textContent = "Введите имя, чтобы начать";
    renderGate();
  });
}

renderGate();
</script>
</body>
</html>
